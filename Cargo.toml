# text-to-phonemes: English text to espeak-ng-style en-us IPA for Piper VITS voices, in pure Rust.
# Data: CMUdict (BSD-style, LICENSE-CMUDICT / NOTICE) plus rules and a letter-context model trained only on CMUdict.
# espeak-ng (GPL-3.0) is never a dependency: only the farm test scripts in tools/ (not packaged) use it, through
# Piper's own phonemizer, as an offline reference to tune the ARPAbet-to-IPA mapping.
[package]
name = "text-to-phonemes"
version = "0.1.0"
authors = ["Partii Games"]
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Pure-Rust English G2P for Piper TTS: text normalization, embedded CMUdict, an OOV letter-to-phoneme model, espeak-ng en-us style IPA and Piper phoneme ids."
readme = "README.md"
repository = "https://github.com/PartiiGames/text-to-phonemes"
keywords = ["g2p", "cmudict", "phonemes", "tts", "piper"]
categories = ["text-processing", "multimedia::audio"]
build = "build.rs"
include = [
    "src/**/*.rs",
    "build.rs",
    "data/cmudict.dict",
    "data/oov.model",
    "tests/*.rs",
    "examples/*.rs",
    "tests/sentences.txt",
    "README.md",
    "NOTICE",
    "LICENSE-MIT",
    "LICENSE-APACHE",
    "LICENSE-CMUDICT",
]

[dependencies]
serde_json = "1"
# NFD, as Piper decomposes phonemes into code points before the id lookup
unicode-normalization = "0.1"

[[bin]]
name = "g2p-tool"
path = "src/bin/g2p-tool.rs"
